[project]
name = "anveshak-db"
version = "0.1.0"
description = "Anveshak DB - bill management backed by Notion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "notion-client",
    "python-dotenv",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
